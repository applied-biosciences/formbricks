name: CALM Surveys Build

on:
  push:
    branches:
      - feature/calm-surveys-self-hosted
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate CALM Surveys
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: formbricks
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64

      - name: Create local environment
        run: pnpm dev:setup

      - name: Point local services at Actions containers
        shell: bash
        run: |
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/formbricks?schema=public"|' .env
          sed -i 's|^REDIS_URL=.*|REDIS_URL="redis://127.0.0.1:6379"|' .env || true

      - name: Run database migrations
        run: pnpm db:migrate:deploy

      - name: Test questionnaire importer
        run: pnpm --filter @formbricks/web test modules/survey/import/lib/normalize-import.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build CALM Surveys
        run: pnpm build --filter=@formbricks/web...
